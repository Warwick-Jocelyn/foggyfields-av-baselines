# NVIDIA_AV_Fog config — RGB-only EmerNeRF (matches pandaset.yaml shape)
# Inherits structure from default_config.yaml; only the keys we override are listed here.

data:
  data_root: /networkhome/WMGDS/wang3_y/ETH/Dataset/NVIDIA_AV_Fog
  dataset: nvidia_av_fog            # routes to NVIDIAAVFogDataset in train_emernerf.py
  scene_idx: "002"                  # str prefix; clip dir resolved by glob match (002_*)
  start_timestep: 0
  end_timestep: -1                  # -1 → use full clip (199 frames @ 10 Hz ≈ 19.9 s)
  ray_batch_size: 8192
  preload_device: cuda
  pixel_source:
    load_size: [960, 1280]          # uniform resize for all 7 heterogeneous cams
                                    # (native: 3x 1280x960, 2x 1120x800, 2x 480x320)
    downscale: 1
    num_cams: 7                     # rear_left, FL, F, FR, rear_right, front_tele, rear_tele
    test_image_stride: 2            # NVS-50/50 style (every other frame to val)
    load_rgb: True
    load_sky_mask: False            # masks/<cam>/valid_mask.png is rectification validity, not sky
    load_dynamic_mask: False
    load_features: False
    skip_feature_extraction: True
    target_feature_dim: 64
    feature_model_type: dinov2_vitb14
    feature_extraction_stride: 7
    feature_extraction_size: [644, 966]
    delete_features_after_run: False
    sampler:
      buffer_downscale: 16
      buffer_ratio: 0.25
  lidar_source:
    load_lidar: False               # RGB-only run
    only_use_top_lidar: False       # only one (top) lidar exists; flag is a no-op
    truncated_max_range: 80
    truncated_min_range: -2
    lidar_downsample_factor: 4
    lidar_percentile: 0.02
  occ_source:
    voxel_size: 0.1

nerf:
  model:
    num_cams: 7                     # must match data.pixel_source.num_cams
    head:
      enable_dynamic_branch: True
      enable_flow_branch: True
      enable_shadow_head: True

eval:
  eval_lidar_flow: False
  remove_ground_when_eval_lidar_flow: True
