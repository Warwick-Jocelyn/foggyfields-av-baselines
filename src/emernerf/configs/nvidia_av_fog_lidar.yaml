# NVIDIA_AV_Fog config — RGB + LiDAR depth supervision (paper-default EmerNeRF)
# Inherits structure from default_config.yaml.

data:
  data_root: /networkhome/WMGDS/wang3_y/ETH/Dataset/NVIDIA_AV_Fog
  dataset: nvidia_av_fog
  scene_idx: "002"
  start_timestep: 0
  end_timestep: -1
  ray_batch_size: 8192
  preload_device: cuda
  pixel_source:
    load_size: [960, 1280]
    downscale: 1
    num_cams: 7
    test_image_stride: 2
    load_rgb: True
    load_sky_mask: False
    load_dynamic_mask: False
    load_features: False
    skip_feature_extraction: True
    target_feature_dim: 64
    feature_model_type: dinov2_vitb14
    feature_extraction_stride: 7
    feature_extraction_size: [644, 966]
    delete_features_after_run: False
    sampler:
      buffer_downscale: 16
      buffer_ratio: 0.25
  lidar_source:
    load_lidar: True                # ENABLE — used for depth + line-of-sight supervision
    only_use_top_lidar: False       # single lidar; flag is a no-op
    truncated_max_range: 80
    truncated_min_range: -2
    lidar_downsample_factor: 4
    lidar_percentile: 0.02
  occ_source:
    voxel_size: 0.1

nerf:
  model:
    num_cams: 7
    head:
      enable_dynamic_branch: True
      enable_flow_branch: True
      enable_shadow_head: True

eval:
  eval_lidar_flow: False
  remove_ground_when_eval_lidar_flow: True
